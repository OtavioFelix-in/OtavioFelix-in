<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270">
<style>
.ty{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:22px;fill:#e9d5ff}
.name{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:54px;font-weight:800;fill:url(#tg)}
.sub{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:16px;letter-spacing:4px;fill:#94a3b8}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.w1{animation:wv 9s ease-in-out infinite alternate}.w2{animation:wv 13s ease-in-out infinite alternate-reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-300px)}}
.dot{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px);opacity:.25}}
#tg stop{animation:none}
@keyframes t0{0%,0.00%{transform:scaleX(0);animation-timing-function:steps(15)}13.33%{transform:scaleX(1)}27.33%{transform:scaleX(1);animation-timing-function:steps(15)}32.33%,100%{transform:scaleX(0)}}
@keyframes c0{0%,0.00%{transform:translateX(0);opacity:1;animation-timing-function:steps(15)}0.01%{opacity:1;transform:translateX(0);animation-timing-function:steps(15)}13.33%{transform:translateX(198.0px);opacity:1}27.33%{transform:translateX(198.0px);opacity:1;animation-timing-function:steps(15)}32.33%{transform:translateX(0);opacity:1}32.34%,100%{opacity:0;transform:translateX(0)}}
#k0{transform-box:fill-box;transform-origin:left;animation:t0 12s infinite}
#cur0{animation:c0 12s infinite}
@keyframes t1{0%,33.33%{transform:scaleX(0);animation-timing-function:steps(16)}46.67%{transform:scaleX(1)}60.67%{transform:scaleX(1);animation-timing-function:steps(16)}65.67%,100%{transform:scaleX(0)}}
@keyframes c1{0%,33.33%{transform:translateX(0);opacity:0;animation-timing-function:steps(16)}33.34%{opacity:1;transform:translateX(0);animation-timing-function:steps(16)}46.67%{transform:translateX(211.2px);opacity:1}60.67%{transform:translateX(211.2px);opacity:1;animation-timing-function:steps(16)}65.67%{transform:translateX(0);opacity:1}65.68%,100%{opacity:0;transform:translateX(0)}}
#k1{transform-box:fill-box;transform-origin:left;animation:t1 12s infinite}
#cur1{animation:c1 12s infinite}
@keyframes t2{0%,66.67%{transform:scaleX(0);animation-timing-function:steps(19)}80.00%{transform:scaleX(1)}94.00%{transform:scaleX(1);animation-timing-function:steps(19)}99.00%,100%{transform:scaleX(0)}}
@keyframes c2{0%,66.67%{transform:translateX(0);opacity:0;animation-timing-function:steps(19)}66.68%{opacity:1;transform:translateX(0);animation-timing-function:steps(19)}80.00%{transform:translateX(250.8px);opacity:1}94.00%{transform:translateX(250.8px);opacity:1;animation-timing-function:steps(19)}99.00%{transform:translateX(0);opacity:1}99.01%,100%{opacity:0;transform:translateX(0)}}
#k2{transform-box:fill-box;transform-origin:left;animation:t2 12s infinite}
#cur2{animation:c2 12s infinite}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset=".55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#c4b5fd"><animate attributeName="stop-color" values="#c4b5fd;#67e8f9;#f0abfc;#c4b5fd" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#67e8f9"><animate attributeName="stop-color" values="#67e8f9;#f0abfc;#c4b5fd;#67e8f9" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<clipPath id="r"><rect width="900" height="270" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="900" height="270" fill="url(#bg)"/>
<g fill="#a78bfa" opacity=".5">
<circle class="dot" cx="80" cy="60" r="2.5"/><circle class="dot" style="animation-delay:-2s" cx="820" cy="50" r="2"/><circle class="dot" style="animation-delay:-4s" cx="720" cy="120" r="1.8"/><circle class="dot" style="animation-delay:-1s" cx="170" cy="140" r="1.6"/><circle class="dot" style="animation-delay:-3s" cx="640" cy="40" r="1.4"/><circle class="dot" style="animation-delay:-5s" cx="260" cy="45" r="2"/>
</g>
<path class="w1" fill="#6366f1" opacity=".18" d="M0 235 Q75 215 150 235 T300 235 T450 235 T600 235 T750 235 T900 235 T1050 235 T1200 235 V270 H0Z"/>
<path class="w2" fill="#22d3ee" opacity=".12" d="M0 245 Q75 262 150 245 T300 245 T450 245 T600 245 T750 245 T900 245 T1050 245 T1200 245 V270 H0Z"/>

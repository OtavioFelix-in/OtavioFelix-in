<svg xmlns="http://www.w3.org/2000/svg" width="420" height="196" viewBox="0 0 420 196">
<style>.h{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:800;fill:#f0f6fc}.d{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#9da7b3}.tag{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:600}
.g{animation:sh 4s linear infinite}@keyframes sh{from{transform:translateX(-420px)}to{transform:translateX(420px)}}
.e{transform-box:fill-box;transform-origin:center;animation:bo 3s ease-in-out infinite}@keyframes bo{50%{transform:translateY(-4px) rotate(-6deg)}}</style>
<defs><linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#f06b93"/><stop offset="1" stop-color="#f4b3c8"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="418" height="194" rx="14"/></clipPath></defs>
<rect x="1" y="1" width="418" height="194" rx="14" fill="#0d1117"/>
<g clip-path="url(#c)"><rect width="420" height="5" fill="url(#b)"/><rect class="g" width="420" height="196" fill="url(#s)"/></g>
<rect x="1" y="1" width="418" height="194" rx="14" fill="none" stroke="url(#b)" stroke-opacity=".6" stroke-width="1.5"/>
<clipPath id="ic"><rect x="24" y="22" width="44" height="44" rx="11"/></clipPath>
<image x="24" y="22" width="44" height="44" clip-path="url(#ic)" href="data:image/png;base64,"/>
<text x="82" y="52" class="h">Madu-Tasks</text>
<text x="24" y="88" class="d"><tspan x="24" dy="0">Agenda de estudos offline-first com SQLite</tspan><tspan x="24" dy="21">e sync opcional via Supabase. Feita sob medida</tspan><tspan x="24" dy="21">pra rotina de estudos da minha namorada.</tspan></text>
<rect x="24.0" y="150" width="102.4" height="24" rx="12" fill="#f06b93" fill-opacity=".15"/><text x="75.2" y="166" text-anchor="middle" class="tag" fill="#f06b93">React Native</text><rect x="134.4" y="150" width="44.8" height="24" rx="12" fill="#f06b93" fill-opacity=".15"/><text x="156.8" y="166" text-anchor="middle" class="tag" fill="#f06b93">Expo</text><rect x="187.2" y="150" width="59.2" height="24" rx="12" fill="#f06b93" fill-opacity=".15"/><text x="216.8" y="166" text-anchor="middle" class="tag" fill="#f06b93">SQLite</text><rect x="254.4" y="150" width="73.6" height="24" rx="12" fill="#f06b93" fill-opacity=".15"/><text x="291.2" y="166" text-anchor="middle" class="tag" fill="#f06b93">Supabase</text>
</svg>